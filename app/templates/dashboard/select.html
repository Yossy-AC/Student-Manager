{% extends "base.html" %}

{% block title %}生徒ダッシュボード - 生徒選択{% endblock %}

{% block content %}
<div class="select-container">
    <h1>成績ダッシュボード</h1>
    <p>生徒を選択してください</p>

    <form class="select-form" id="dashboard-form">
        <label for="studentSelect" class="sr-only">生徒</label>
        <select id="studentSelect" class="portal-input" required autofocus>
            <option value="">選択してください</option>
            {% for s in students %}
            <option value="{{ s.id }}">{{ s.name }}（{{ s.id }}）</option>
            {% endfor %}
        </select>
        <button type="submit" class="portal-btn portal-btn-primary">表示</button>
    </form>
</div>

<style>
    .select-container {
        max-width: 400px;
        margin: 4rem auto;
        text-align: center;
    }
    .select-container h1 {
        margin-bottom: 0.5rem;
        color: var(--p-text);
    }
    .select-container p {
        color: var(--p-text-secondary);
        margin-bottom: 2rem;
    }
    .select-form {
        display: flex;
        gap: 0.5rem;
    }
    .select-form .portal-input {
        flex: 1;
    }
</style>

<script nonce="{{ request.state.csp_nonce }}">
document.getElementById('dashboard-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var id = document.getElementById('studentSelect').value;
    if (id) {
        window.location.href = 'dashboard/' + encodeURIComponent(id);
    }
});
</script>
{% endblock %}
